<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="/EDP PREFINALS/css/signup.css">
</head>
<body>

  <div class="container-box">
    <div class="right">
      <h2>Sign up now</h2>

      <form>

        <label>Full Name</label>
        <input type="text" class="form-control-lg" placeholder="Enter your full name" required>

        <label>Username</label>
        <input type="text" class="form-control-lg" placeholder="Enter username" required>

        <label>Email</label>
        <input type="email" class="form-control-lg" placeholder="Enter email address" required>

        <label>Password</label>
        <input type="password" class="form-control-lg" placeholder="Enter password" required>

        <label>Confirm Password</label>
        <input type="password" class="form-control-lg" placeholder="Re-enter password" required>

        <button type="submit" class="btn-custom">Create Account</button>

      </form>

      <p class="small">Already have an account? <a href="#">Log in</a></p>

    </div>
  </div>

</body>
</html>
